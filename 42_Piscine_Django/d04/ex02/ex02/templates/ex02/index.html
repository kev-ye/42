<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ex02 : Form</title>
</head>
<body>
    <h1>Ex02 : Form</h1>
    
    <h2>Submit Entry</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    
    <h2>History</h2>
    {% if history %}
        <ul>
            {% for entry in history %}
                <li>{{ entry }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No entries yet.</p>
    {% endif %}
</body>
</html>
